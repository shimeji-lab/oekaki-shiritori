<title>お絵かきしりとり</title>
<!--
  お絵かきしりとり  oekaki-shiritori_v1.6.html
  更新履歴
  v1.6 (2026-11-03) ・しりとり：最後の人の絵にも、次の人が答えを書くようにした（全部の絵に答え合わせ）
                    ・ルビの整理：タイトル・人数と、小学1年で習う漢字（人・見・文字・名・正・一 など）はルビなし
                    ・スクロールバーが入力欄に重ならないよう、左右の余白側に出るようにした（細く目立たない色に）
                    ・手渡し画面と描き終わり画面の絵文字を、アプリの絵柄に合わせた線画イラストに変更
                    ・ファビコン（黄色い付箋に黒ペンのらくがき）を追加。ホーム画面に追加したときのアイコンにも使う
                    ・総点検：保存ファイル名に使えない文字を置き換え／「ー」だけの答えをはじく／描き終わり後の再開を修正
                    ・ファイルマネージャーから開いたときなど Wake Lock が使えない環境でも、無音動画でスリープ防止を試みる
                    ・名前や途中経過を保存できない開き方のときは、はじめの画面にその旨を表示
  v1.5 (2026-11-03) ・「伝言ゲーム」モードを追加：お題を絵だけでつなぎ、さいごの人がお題をあてる。
                      前の絵を見られる時間（5／10／20秒）を選べる。発表モード・まとめ画像も対応。
                      お題を知っている最初の人が当てないよう、描くのは1〜(人数-1)番目、最後の人が当てる（1周のみ）
                    ・人数を減らしても名前欄の高さが変わらないようにし、画面がガクッと動かないようにした
                    ・はじめの画面で項目が多いとき、「周」などの切り替えボタンが潰れて押しにくくなる不具合を修正
  v1.4 (2026-11-03) ・キャンバス／発表モードの絵が画面からはみ出して枠が欠ける問題を修正
                    ・画面の切り替え演出は画面が変わったときだけにした（人数の増減や発表モードのめくりで画面が揺れない）
                    ・発表モードで答えを出しても絵の大きさが変わらないよう、答え欄の高さを固定
                    ・まとめ画像の文字が「…」で切れないよう、長い名前や言葉は折り返して全部表示
                    ・狭い画面で下のボタンの文字が2行に割れないようにした
  v1.3 (2026-11-03) ・画面スリープ防止（対応ブラウザのみ。ゲーム中は画面が暗くならない）
                    ・発表モード：結果を1枚ずつ大きく表示し、絵→描いたもの→次の人の答えの順にめくる
                    ・候補語を拡充しジャンル分け（どうぶつ／たべもの／のりもの／どうぐ・もの／しぜん・たてもの）。
                      最初のお題のジャンルを選べる。わたあめ／わたがし のような呼び方が割れる言葉を削除
                    ・答え合わせで「ー」と「う・い」などの長音表記ゆれを同じ扱いに（ろうそく＝ろーそく）
                    ・漢字にふりがな（ルビ）を付けた
                    ・戻る操作対策：ゲーム中は端スワイプ／戻るボタンでページが消えないようにした。
                      描きかけの絵も自動保存し、万一閉じても「続きから」で描きかけに戻れる
  v1.2 (2026-11-03) ・結果画面に「人ごとまとめ」タブを追加。描いた人ごと／全員のまとめ画像を作成して保存できる
  v1.1 (2026-11-03) ・単体で動くHTMLファイルに変更（ブラウザで開くだけで遊べる。画像保存はファイルとしてダウンロード）
                    ・前回の人数・周回数・名前を記憶して、次回の初期値にする（「名前をクリア」で消去）
                    ・スマホのキーボード対策：決定ボタンを画面下に固定し、キーボードが出ても真上に来るように
                      表示領域を追従。キーボード表示中は絵が縮んで入力欄とボタンが隠れない
                    ・改行キーで決定／次の名前欄へ移動
  v1.0 (2026-11-03) 初版：人数・周回選択／ランダムお題とヒント／白黒・太さ固定ペン／
                    手渡し画面／結果一覧（めくって答え合わせ）／画像の個別保存／途中再開
-->

<style>
/* Layout: one-screen phone app on graph paper; each step = scrolling body + fixed action bar that rides above the keyboard */
:root{
  --paper:#F7F9FD; --grid:rgba(43,89,195,.09); --surface:#FFFFFF; --ink:#15171C; --muted:#5A6272;
  --line:#D6DCE8; --accent:#2B59C3; --marker:#FFE14D; --on-marker:#15171C;
  --ok:#1D7F47; --ng:#B9362C;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13161C; --grid:rgba(126,160,240,.08); --surface:#1B1F27; --ink:#ECEEF3; --muted:#9BA3B3;
  --line:#2E3440; --accent:#86A6F2; --marker:#EBCB3A; --ok:#5FC48A; --ng:#F07A70; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13161C; --grid:rgba(126,160,240,.08); --surface:#1B1F27; --ink:#ECEEF3; --muted:#9BA3B3;
  --line:#2E3440; --accent:#86A6F2; --marker:#EBCB3A; --ok:#5FC48A; --ng:#F07A70; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%; margin:0; overscroll-behavior:none}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--f-body); font-weight:500; font-size:16px; line-height:1.6;
  overflow:hidden; -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
input{-webkit-user-select:text; user-select:text}
.rc img,.sum img,.pimg{-webkit-touch-callout:default}
#app{position:fixed; left:0; right:0; top:0; height:100%; padding-top:env(safe-area-inset-top,0px)}
.screen{height:100%; display:flex; flex-direction:column; max-width:672px; margin:0 auto}
/* 左右の余白はスクロール領域の内側に持たせる → スクロールバーは画面端の余白に出て、入力欄に重ならない */
.body{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:16px; padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  scrollbar-width:thin; scrollbar-color:var(--line) transparent}
.body::-webkit-scrollbar{width:5px}
.body::-webkit-scrollbar-thumb{background:var(--line); border-radius:9px}
.body::-webkit-scrollbar-track{background:transparent}
/* 縦に並ぶ部品は縮ませない（中身が多いとき、切り替えボタン等が潰れていた） */
.body > *{flex-shrink:0}
.body > .prevwrap,.body > .pwrap,.body > .cwrap{flex-shrink:1}
.body.center{justify-content:center; align-items:center; text-align:center; gap:18px}
.body.fixed{overflow:hidden}
.foot{flex:none; display:flex; gap:8px; padding-top:10px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-bottom:calc(12px + env(safe-area-inset-bottom,0px)); border-top:2px solid var(--line); background:var(--paper)}
body.kb .foot{padding-bottom:10px}
.foot .btn{flex:1; padding:0 6px; white-space:nowrap; font-size:16px}
.foot .btn.primary{flex:1.6}

ruby{ruby-position:over}
rt{font-family:var(--f-body); font-weight:700; font-size:.46em; letter-spacing:0; line-height:1}
h1,h2{font-family:var(--f-display); font-weight:400; margin:0; text-wrap:balance; letter-spacing:.02em}
h1{font-size:clamp(34px,10vw,48px); line-height:1.35; padding-top:6px}
h2{font-size:22px; line-height:1.55}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.label{font-size:13px; color:var(--muted); letter-spacing:.08em; font-weight:700; line-height:1.9}
.turn{font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; font-weight:700; line-height:1.9}

.rules{display:grid; gap:8px; margin:0; padding:0; list-style:none; counter-reset:r; line-height:1.9}
.rules li{display:flex; gap:10px; align-items:baseline}
.rules li::before{counter-increment:r; content:counter(r); flex:none; width:24px; height:24px; border-radius:50%;
  background:var(--ink); color:var(--paper); font-size:13px; font-weight:700; line-height:1; display:grid; place-items:center; transform:translateY(5px)}

.field{display:grid; gap:8px}
.row{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.spread{display:flex; justify-content:space-between; align-items:center; gap:8px}
.spread .turn{white-space:nowrap}
.stepper{display:flex; align-items:center; gap:4px; background:var(--surface); border:2px solid var(--ink); border-radius:14px; padding:4px}
.stepper button{width:44px; height:44px; border:0; border-radius:10px; background:transparent; color:var(--ink); font-size:24px; font-family:var(--f-body); cursor:pointer}
.stepper button:disabled{opacity:.3}
.stepper output{min-width:64px; text-align:center; font-family:var(--f-display); font-size:26px; font-variant-numeric:tabular-nums}
.seg{display:flex; border:2px solid var(--ink); border-radius:14px; overflow:hidden; background:var(--surface)}
.seg button{flex:1; min-width:64px; height:52px; border:0; background:transparent; color:var(--ink); font-family:var(--f-body); font-weight:700; font-size:16px; cursor:pointer}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips button{height:42px; padding:0 14px; border-radius:999px; border:2px solid var(--ink); background:var(--surface); color:var(--ink);
  font-family:var(--f-body); font-weight:700; font-size:15px; cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}

.names{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px}
input[type=text]{width:100%; height:52px; padding:0 14px; border:2px solid var(--line); border-radius:12px;
  background:var(--surface); color:var(--ink); font-family:var(--f-body); font-size:18px; font-weight:700}
input[type=text]:focus{outline:none; border-color:var(--accent)}
.names input{height:46px; font-size:16px}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:56px; padding:0 20px; border-radius:14px;
  border:2px solid var(--ink); background:var(--surface); color:var(--ink); font-family:var(--f-body); font-weight:700; font-size:17px; line-height:1.5; cursor:pointer; touch-action:manipulation}
.btn.primary{background:var(--ink); color:var(--paper)}
.btn.ghost{border-color:transparent; background:transparent; color:var(--accent); min-height:42px; padding:0 4px; font-size:15px}
.btn.wide{width:100%}
.btn:disabled{opacity:.35; cursor:default}
.btn.warn{border-color:var(--ng); color:var(--ng)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.bar{display:flex; gap:8px}
.bar .btn{flex:1; padding:0 10px}

.card{background:var(--surface); border:2px solid var(--line); border-radius:16px; padding:16px; display:grid; gap:12px}

.chip{flex:none; display:inline-grid; place-items:center; width:72px; height:72px; border-radius:50%; background:var(--marker); color:var(--on-marker);
  font-family:var(--f-display); font-size:40px; line-height:1; transform:rotate(-4deg)}
.topic{font-family:var(--f-display); font-size:clamp(40px,13vw,64px); line-height:1.2; background:linear-gradient(transparent 58%,var(--marker) 58%);
  padding:0 .15em; color:var(--ink)}
.art{width:min(200px,56vw); height:auto; display:block; overflow:visible}
.art .s{fill:none; stroke:var(--ink); stroke-width:4; stroke-linecap:round; stroke-linejoin:round}
.art .t{stroke-width:3}
.art .m{fill:none; stroke:var(--marker); stroke-width:16; stroke-linecap:round}
.art .f{fill:var(--surface)}
.art .k{fill:var(--ink)}
.art .y{fill:var(--marker)}
.who{font-family:var(--f-display); font-size:clamp(30px,9vw,42px); line-height:1.25; overflow-wrap:anywhere}

.hints{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.hints button[data-w]{border:2px dashed var(--accent); background:transparent; color:var(--accent); border-radius:999px; padding:6px 14px;
  font-family:var(--f-body); font-weight:700; font-size:16px; cursor:pointer}
.ghostslot{visibility:hidden}
.timer{display:flex; align-items:center; gap:12px}
.tbar{flex:1; height:10px; border-radius:99px; background:var(--line); overflow:hidden}
.tbar i{display:block; height:100%; width:100%; background:var(--accent)}
.timer b{font-family:var(--f-display); font-weight:400; font-size:28px; font-variant-numeric:tabular-nums; min-width:1.6em; text-align:right}
.v.big2{font-family:var(--f-display); font-weight:400; font-size:30px; line-height:1.3}
.err{color:var(--ng); font-weight:700; font-size:15px; line-height:1.9}
.err:empty{display:none}

/* 前の絵：キーボードが出たら縮む */
.prevwrap{flex:1 1 auto; min-height:90px; display:flex; justify-content:center; align-items:center; padding:3px}
.prev{max-width:100%; max-height:100%; width:auto; height:100%; aspect-ratio:1; object-fit:contain; border-radius:12px; border:2px solid var(--line); background:#fff; display:block}

.drawhead{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.drawhead .what{background:var(--marker); color:var(--on-marker); border-radius:10px; padding:2px 12px; font-weight:700; max-width:100%; overflow-wrap:anywhere; line-height:1.9}
.cwrap{flex:1; min-height:0; min-width:0; display:grid; place-items:center; padding:4px; overflow:hidden}
canvas{display:block; max-width:100%; max-height:100%; background:#fff; border-radius:12px; box-shadow:0 0 0 2px var(--ink); touch-action:none; cursor:crosshair}

.tabs{display:flex; border:2px solid var(--ink); border-radius:14px; overflow:hidden; background:var(--surface); flex:none}
.tabs button{flex:1; min-height:50px; border:0; background:transparent; color:var(--ink); font-family:var(--f-body); font-weight:700; font-size:15px; cursor:pointer}
.tabs button+button{border-left:2px solid var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink); color:var(--paper)}
.results{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px}
.rc{background:var(--surface); border:2px solid var(--line); border-radius:16px; padding:12px; display:grid; gap:10px; align-content:start}
.rc header{display:flex; align-items:center; gap:8px; line-height:1.9}
.no{font-family:var(--f-display); font-size:18px; font-variant-numeric:tabular-nums; min-width:2.2em}
.rc img{width:100%; aspect-ratio:1; border-radius:10px; border:1px solid var(--line); background:#fff; display:block}
.ans{display:grid; gap:4px; font-size:15px}
.ans .k{color:var(--muted); font-size:13px; font-weight:700; line-height:1.9}
.ans .v{font-weight:700; font-size:18px; overflow-wrap:anywhere}
.mark{font-weight:700; font-size:14px; border-radius:999px; padding:1px 10px; margin-left:6px; vertical-align:2px; line-height:1.9}
.mark.ok{color:var(--ok); border:2px solid var(--ok)}
.mark.ng{color:var(--ng); border:2px solid var(--ng)}
.reveal{border:2px dashed var(--line); border-radius:10px; min-height:84px; background:transparent; color:var(--accent); font-family:var(--f-body); font-weight:700; font-size:16px; cursor:pointer}
.rc .actions,.sum .actions{display:flex; gap:8px; align-items:center; justify-content:space-between; flex-wrap:wrap}
.rc .actions .btn,.sum .actions .btn{min-height:44px; font-size:15px; padding:0 14px}
.score{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.score b{font-family:var(--f-display); font-weight:400; font-size:40px; font-variant-numeric:tabular-nums}
.sums{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px}
.sum{background:var(--surface); border:2px solid var(--line); border-radius:16px; padding:12px; display:grid; gap:10px; align-content:start}
.sum img{width:100%; border-radius:8px; border:1px solid var(--line); display:block}
.loading{min-height:160px; display:grid; place-items:center; color:var(--muted); border:2px dashed var(--line); border-radius:10px; font-weight:700}

/* 発表モード */
.pwrap{flex:1 1 auto; min-height:160px; display:flex; justify-content:center; align-items:center; padding:4px}
.pimg{max-width:100%; max-height:100%; width:auto; height:100%; aspect-ratio:1; object-fit:contain; border-radius:14px; box-shadow:0 0 0 2px var(--ink); background:#fff; display:block; cursor:pointer}
.pans{flex:none; display:grid; gap:6px; min-height:132px; align-content:start}
.pans .k{color:var(--muted); font-size:14px; font-weight:700; line-height:1.9}
.pans .big{font-family:var(--f-display); font-size:clamp(28px,8vw,40px); line-height:1.25; overflow-wrap:anywhere}
.pans .q{font-family:var(--f-display); font-size:26px; color:var(--muted); text-align:center; padding-top:20px; line-height:1.6}
.stamp{display:inline-block; font-family:var(--f-display); font-size:22px; border-radius:10px; padding:0 12px; margin-left:10px; vertical-align:6px; line-height:1.7}
.stamp.ok{color:var(--ok); border:3px solid var(--ok)}
.stamp.ng{color:var(--ng); border:3px solid var(--ng)}
@supports (width:1cqmin){
  .prevwrap,.pwrap{container-type:size}
  .prev,.pimg{width:calc(100cqmin - 6px); height:calc(100cqmin - 6px); max-width:none; max-height:none}
}
.pans{position:relative; min-height:184px}
.pans .slot{visibility:hidden}
.pans .slot.on{visibility:visible}
.pans .q{position:absolute; inset:0; display:grid; place-items:center; padding:0}
@media (prefers-reduced-motion: no-preference){ .pop{animation:pop .25s ease-out} @keyframes pop{from{opacity:0}to{opacity:1}} }

#toast{position:fixed; left:50%; top:calc(16px + env(safe-area-inset-top,0px)); transform:translateX(-50%); background:var(--ink); color:var(--paper);
  padding:10px 18px; border-radius:12px; font-weight:700; font-size:15px; line-height:1.9; max-width:calc(100% - 40px); text-align:center; z-index:20}
@media (prefers-reduced-motion: no-preference){
  .screen.enter{animation:in .18s ease-out}
  @keyframes in{from{opacity:.3}to{opacity:1}}
}
</style>

<script>
(function(){
"use strict";
// ---------- ことば ----------
// ・ランダムのお題とヒントに使う。どれも「ん」で終わらない、呼び方が割れにくい言葉だけ
// ・HINT_ONLY は文字数の少ない頭文字（ぬ・る・れ など）を補うためのヒント専用（お題には出ない）
var GENRES = [
  {id:"animal", label:"どうぶつ", words:
    "あり いぬ いか いるか いのしし うさぎ うし うま えび おおかみ おたまじゃくし かえる かたつむり かに かば かぶとむし かまきり "+
    "かみきりむし かめ きつね くま くじら くじゃく くらげ くわがた けむし こあら こうもり ごりら さかな さそり さめ さる しか しまうま "+
    "せみ ぞう たこ たぬき だちょう てんとうむし とかげ とら とんぼ にわとり ねこ ねずみ はち はりねずみ ばった ぱんだ ひつじ ひとで "+

VIEWS.draw = {
  html:function(){
    return screen(
      '<div class="drawhead"><p class="turn">'+turnLabel()+'</p>'+
      '<span class="what">'+(isD()&&S.t>0?'{見|み}た{絵|え}を{描|か}こう':'{描|か}くもの：'+esc(S.cur.word))+'</span></div>'+
      '<div class="cwrap" id="cwrap"><canvas id="cv" width="'+SIZE+'" height="'+SIZE+'" aria-label="おえかきエリア"></canvas></div>',
      '<button class="btn" id="undo" type="button">1つもどす</button><button class="btn" id="clear" type="button">ぜんぶけす</button><button class="btn primary" id="done" type="button">{描|か}けた！</button>', "fixed");
  },
  bind:function(){
    var cv=$("cv"), wrap=$("cwrap"), ctx=cv.getContext("2d"), strokes=S.cur.strokes, cur=null, pid=null;
    function pen(){ ctx.lineCap="round"; ctx.lineJoin="round"; ctx.lineWidth=LW; ctx.strokeStyle="#000"; ctx.fillStyle="#000"; }
    function dot(p){ ctx.beginPath(); ctx.arc(p[0],p[1],LW/2,0,Math.PI*2); ctx.fill(); }
    function redraw(){
      ctx.fillStyle="#fff"; ctx.fillRect(0,0,SIZE,SIZE); pen();
      strokes.forEach(function(s){ if(s.length===1){dot(s[0]);return;} ctx.beginPath(); ctx.moveTo(s[0][0],s[0][1]); for(var i=1;i<s.length;i++) ctx.lineTo(s[i][0],s[i][1]); ctx.stroke(); });
      sync();
    }
    function sync(){ $("undo").disabled=!strokes.length; $("clear").disabled=!strokes.length; $("done").disabled=!strokes.length; }
    function fit(){ var s=Math.floor(Math.min(wrap.clientWidth,wrap.clientHeight))-8; if(s>0){ cv.style.width=s+"px"; cv.style.height=s+"px"; } }
    function pos(e){ var r=cv.getBoundingClientRect(); return [Math.round((e.clientX-r.left)*SIZE/r.width*10)/10, Math.round((e.clientY-r.top)*SIZE/r.height*10)/10]; }
    cv.addEventListener("pointerdown",function(e){
      if(pid!==null) return; pid=e.pointerId; try{cv.setPointerCapture(pid);}catch(_){}
      cur=[pos(e)]; strokes.push(cur); pen(); dot(cur[0]); e.preventDefault();
    });
    cv.addEventListener("pointermove",function(e){
      if(e.pointerId!==pid||!cur) return;
      var evs=e.getCoalescedEvents?e.getCoalescedEvents():[e]; if(!evs.length) evs=[e];
      pen();
      evs.forEach(function(ev){ var p=pos(ev), l=cur[cur.length-1]; if(Math.abs(p[0]-l[0])+Math.abs(p[1]-l[1])<2) return;
        ctx.beginPath(); ctx.moveTo(l[0],l[1]); ctx.lineTo(p[0],p[1]); ctx.stroke(); cur.push(p); });
      e.preventDefault();
    });
    function end(e){ if(e.pointerId!==pid) return; pid=null; cur=null; sync(); persistCur(); }
    cv.addEventListener("pointerup",end); cv.addEventListener("pointercancel",end);
    $("undo").onclick=function(){ if(pid===null){ strokes.pop(); redraw(); persistCur(); } };
    confirmBtn($("clear"),"もう一{度|ど}で けす",function(){ strokes.length=0; redraw(); persistCur(); });
    $("done").onclick=function(){
      if(!strokes.length) return;
      redraw();
      if(isD() && S.t===0) S.topic=S.cur.word;
      S.turns.push({ p:playerOf(S.t), guess:isD()?null:S.cur.guess, word:(isD()&&S.t>0)?null:S.cur.word, png:cv.toDataURL("image/png") });
      S.t++; S.cur={guess:"",word:"",strokes:[]}; persist(); persistCur();
      go("handoff");   // 最後の絵のあとは「答える人」へ渡す
    };
    if(window.ResizeObserver) new ResizeObserver(fit).observe(wrap); else window.addEventListener("resize",fit);
    fit(); redraw();
  }
};

      S.sums[it.key]=png; if(S.screen==="results" && S.tab==="sum") render(true);

function ellipsis(ctx, text, maxW){

  return text+"…";

// {漢字|かな} を含む文字列をルビ付きで描く。戻り値は全体の幅
function drawRuby(c, text, x, y, size, font, rubyFont){
  var parts=[], re=/\{([^|{}]+)\|([^{}]+)\}/g, last=0, m;
  while((m=re.exec(text))){ if(m.index>last) parts.push([text.slice(last,m.index),null]); parts.push([m[1],isG1(m[1])?null:m[2]]); last=re.lastIndex; }
  if(last<text.length) parts.push([text.slice(last),null]);
  var cx=x;
  parts.forEach(function(p){
    c.font=font; var w=c.measureText(p[0]).width; c.fillText(p[0],cx,y);
    if(p[1]){ c.save(); c.font=rubyFont; c.textAlign="center"; c.fillText(p[1],cx+w/2,y-size*0.98); c.restore(); }
    cx+=w;
  });

function plain(text){ return text.replace(/\{([^|{}]+)\|([^{}]+)\}/g,"$1"); }

function buildSummary(it){

      } else {

      var okH=same(S.fin.guess,S.topic); hm={t:okH?"つたわった！":"ざんねん",c:okH?OK:NG};
      hl=wrapLines(meas,"おだい「"+S.topic+"」 → "+name(S.fin.p)+" さんの こたえ「"+S.fin.guess+"」",HF,W-pad*2,0);
      meas.font=HF; if(meas.measureText(hl[hl.length-1]).width+16+meas.measureText(hm.t).width>W-pad*2) hl.push("");
    }
    var rows=Math.ceil(n/cols), headH=210+(hl.length?hl.length*44+12:0), rowTop=[], y=headH;

    c.strokeStyle="rgba(43,89,195,0.09)"; c.lineWidth=1;
    for(var gx=0.5;gx<W;gx+=36){ c.beginPath(); c.moveTo(gx,0); c.lineTo(gx,H); c.stroke(); }
    for(var gy=0.5;gy<H;gy+=36){ c.beginPath(); c.moveTo(0,gy); c.lineTo(W,gy); c.stroke(); }
    // 見出し（ルビ付き・マーカー下線）
    c.textBaseline="alphabetic";
    var ty0=pad+86, tFont="400 64px "+DISP, rFont="700 24px "+BODY;
    c.font=tFont; var tw=c.measureText(plain(it.title)).width;
    c.fillStyle=MARK; c.fillRect(pad-6,ty0-26,Math.min(tw,W-pad*2)+12,30);
    c.fillStyle=INK; drawRuby(c,it.title,pad,ty0,64,tFont,rFont);
    var d=new Date();
    c.font="700 26px "+BODY; c.fillStyle=MUTED;
    c.fillText("おえかき "+(isD()?"でんごんゲーム":"しりとり")+" ・ "+d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()+" ・ "+n+"まい",pad,ty0+52);
    hl.forEach(function(t,k){
      var by=ty0+52+50+k*44; c.font=HF; c.fillStyle=INK; c.fillText(t,pad,by);
      if(k===hl.length-1){ c.fillStyle=hm.c; c.fillText(hm.t,pad+(t?c.measureText(t).width+16:0),by); }
    });
    it.idxs.forEach(function(ti,k){
      var col=k%cols, row=Math.floor(k/cols), x=pad+col*(cell+gap), y0=rowTop[row];
      c.save(); rrect(c,x,y0,cell,cell,14); c.fillStyle="#FFFFFF"; c.fill(); c.clip(); c.drawImage(imgs[k],x,y0,cell,cell); c.restore();
      rrect(c,x,y0,cell,cell,14); c.lineWidth=2; c.strokeStyle=LINE; c.stroke();
      var ty=y0+cell+14;
      c.textBaseline="middle";
      lays[k].forEach(function(l,li){
        var mid=ty+l.lh/2;
        if(li===0){   // 何枚目かのバッジ
          c.beginPath(); c.arc(x+br,mid,br,0,Math.PI*2); c.fillStyle=INK; c.fill();
          c.fillStyle="#FFFFFF"; c.font="700 "+Math.round(br*1.2)+"px "+BODY; c.textAlign="center";
          c.fillText(String(ti+1),x+br,mid+1); c.textAlign="left";
        }
        c.font=l.f; c.fillStyle=l.c; c.fillText(l.t,x+l.x,mid);
        if(l.mark){ var mx=x+l.x+(l.t?c.measureText(l.t).width+12:0); c.fillStyle=l.mark.c; c.fillText(l.mark.t,mx,mid); }
        ty+=l.lh;
      });
      c.textBaseline="alphabetic";
    });
    return cv.toDataURL("image/png");
  });
}

function dataUrlToBytes(u){ var bin=atob(u.split(",")[1]), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
function saveDataUrl(png, fn, btn){
  if(!png) return;
  fn=fn.replace(/[\\/:*?"<>|\s]+/g,"_");
  var bytes=dataUrlToBytes(png);
  if(downloads){   // claude.ai 上で開いたとき
    btn.disabled=true;
    downloads.save({filename:fn, data:bytes}).then(function(){ toast("{保存|ほぞん}しました"); })
    .catch(function(err){ var c=err&&err.code; if(c==="declined") return; toast(c==="rate_limited"?"すこし まってから もう一{度|ど}":"ここでは{保存|ほぞん}できません。{画像|がぞう}を ながおしして{保存|ほぞん}してね"); })
    .then(function(){ btn.disabled=false; });
    return;
  }
  try{
    var url=URL.createObjectURL(new Blob([bytes],{type:"image/png"}));
    saving=true; setTimeout(function(){ saving=false; },1500);
    var a=document.createElement("a"); a.href=url; a.download=fn; a.rel="noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },10000);
    toast("ダウンロードしました");
  }catch(e){ toast("{保存|ほぞん}できませんでした。{画像|がぞう}を ながおしして{保存|ほぞん}してね"); }
}

vfit();
render();

if(window.claude && window.claude.use){
  window.claude.use("downloads").then(function(d){ downloads=d; }).catch(function(){});
}

window.__oekaki = { GENRES:GENRES, HINT_POOL:HINT_POOL, ALL_TOPICS:ALL_TOPICS, key:key, same:same };
})();
